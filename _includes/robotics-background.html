<div class="robotics-background" aria-hidden="true">
  <img class="robotics-background__still"
       src="{{ '/assets/videos/robot-precision-poster.jpg' | relative_url }}"
       alt="" fetchpriority="low" decoding="async">
  <video class="robotics-background__video" id="robotics-background-video"
         muted loop playsinline autoplay preload="none"
         poster="{{ '/assets/videos/robot-precision-poster.jpg' | relative_url }}"
         data-src="{{ '/assets/videos/robot-precision-loop.mp4' | relative_url }}"
         data-src-sm="{{ '/assets/videos/robot-precision-loop-sm.mp4' | relative_url }}"></video>
  <div class="robotics-background__wash"></div>
  <div class="robotics-background__grain"></div>
</div>
