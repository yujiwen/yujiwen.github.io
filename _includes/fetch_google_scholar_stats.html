<script>
    $(document).ready(function () {
        var citEl = document.getElementById('total_cit');
        var defaultCitation = citEl ? Number(citEl.textContent) : 0;
        // Older cached stats must not overwrite the updated value in HTML.
        if (citEl) {
            var cachedCit = localStorage.getItem('total_cit_cache');
            if (Number(cachedCit) > defaultCitation) { citEl.textContent = Number(cachedCit); }
        }
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        // jsDelivr tells browsers to cache this file for 7 days; the query string
        // bypasses that (the CDN ignores it, so its own cache still applies).
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json?t=" + Date.now(), function (data) {
            var totalCitation = Math.max(defaultCitation, Number(data['citedby']) || 0);
            if (citEl) { citEl.textContent = totalCitation; }
            // Persist the latest fetched value as the new default for future visits
            localStorage.setItem('total_cit_cache', totalCitation);
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var numCitations = data['publications'][paperId]['num_citations']
                element.innerHTML = '| Citations: ' + numCitations;
            });
        });
    })
</script>
