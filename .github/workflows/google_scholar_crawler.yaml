name: Get Citation Data

on:
  schedule:
    # Weekly, Sunday 18:00 UTC. Citation counts move slowly, and GitHub
    # auto-disables scheduled workflows on repos with no other activity
    # for 60 days, so this alone won't keep it alive forever — a manual
    # "Run workflow" click (or any push) resets that clock.
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Purge jsDelivr cache
      # The homepage reads these files through jsDelivr, which otherwise keeps
      # serving the previous copy for up to 12 hours after the push above.
      run: |
        for f in gs_data.json gs_data_shieldsio.json; do
          curl -sS --retry 3 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@google-scholar-stats/$f"
        done
